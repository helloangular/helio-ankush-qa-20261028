{
  "name": "qa-ankush-provider",
  "run-name": "${{ inputs.helio_execution_id }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "helio_execution_id": {
          "type": "string",
          "required": false,
          "default": ""
        },
        "helio_release_id": {
          "type": "string",
          "required": false,
          "default": ""
        },
        "workflow_revision": {
          "type": "string",
          "required": false,
          "default": ""
        },
        "release_version": {
          "type": "string",
          "required": false,
          "default": ""
        },
        "environment": {
          "type": "string",
          "default": "qa-ankush-provider-production"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "deployments": "write"
  },
  "concurrency": {
    "group": "qa-ankush-provider-release",
    "cancel-in-progress": false
  },
  "jobs": {
    "test": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "environment": "qa-ankush-provider-test",
      "steps": [
        {
          "name": "Synthetic runner work",
          "shell": "bash",
          "run": "sleep 30"
        }
      ]
    },
    "production": {
      "needs": "test",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "environment": "qa-ankush-provider-production",
      "steps": [
        {
          "name": "Synthetic runner work",
          "shell": "bash",
          "run": "sleep 30"
        },
        {
          "name": "Record synthetic deployment evidence",
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "APP_SLUG": "qa-ankush-provider",
            "TARGET_ENVIRONMENT": "qa-ankush-provider-production",
            "HELIO_EXECUTION_ID": "${{ inputs.helio_execution_id }}",
            "HELIO_RELEASE_ID": "${{ inputs.helio_release_id }}",
            "WORKFLOW_REVISION": "${{ inputs.workflow_revision }}",
            "RELEASE_VERSION": "${{ inputs.release_version }}"
          },
          "run": "set -euo pipefail\npython3 - <<'PY'\nimport hashlib, json, os, pathlib, re, uuid\nuuid.UUID(os.environ[\"HELIO_RELEASE_ID\"])\nassert re.fullmatch(r\"[A-Za-z0-9._:-]{1,200}\", os.environ[\"HELIO_EXECUTION_ID\"])\nassert os.environ[\"WORKFLOW_REVISION\"] == os.environ[\"GITHUB_SHA\"]\nartifact = pathlib.Path(\"synthetic-artifact.json\")\nartifact.write_text(json.dumps({\"application\": os.environ[\"APP_SLUG\"], \"version\": os.environ[\"RELEASE_VERSION\"], \"commit\": os.environ[\"GITHUB_SHA\"]}, sort_keys=True))\ndigest = \"sha256:\" + hashlib.sha256(artifact.read_bytes()).hexdigest()\ndeployed = pathlib.Path(\"synthetic-deployed.json\")\ndeployed.write_bytes(artifact.read_bytes())\nassert \"sha256:\" + hashlib.sha256(deployed.read_bytes()).hexdigest() == digest\npayload = {\"schema_version\": 1, \"helio_execution_id\": os.environ[\"HELIO_EXECUTION_ID\"], \"release_id\": os.environ[\"HELIO_RELEASE_ID\"], \"artifact_digest\": digest, \"artifact_uri\": \"urn:helio-capacity:\" + os.environ[\"APP_SLUG\"] + \"@\" + digest, \"rollback_workflow_id\": \".github/workflows/\" + os.environ[\"APP_SLUG\"] + \".yml\", \"workflow_revision\": os.environ[\"WORKFLOW_REVISION\"]}\npathlib.Path(\"deployment-evidence.json\").write_text(json.dumps({\"ref\": os.environ[\"GITHUB_SHA\"], \"auto_merge\": False, \"required_contexts\": [], \"environment\": os.environ[\"TARGET_ENVIRONMENT\"], \"task\": \"helio-forward-release\", \"payload\": payload}))\nPY\ndeployment_id=\"$(gh api --method POST \"repos/$GITHUB_REPOSITORY/deployments\" --input deployment-evidence.json --jq .id)\"\ngh api --method POST \"repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses\" -f state=success -f description=\"Synthetic capacity artifact copied and digest verified; no application deployment\" > /dev/null"
        }
      ]
    }
  }
}
